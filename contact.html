<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrightPath Digital Academy</title>
  <!-- Bootstrap 5.3.8 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-warning" href="index.html">
        <i class="bi bi-laptop me-2"></i>BrightPath Digital Academy
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h1 class="text-center fw-bold mb-4">Get in Touch</h1>
    <div class="row g-5">
      <!-- Contact Info -->
      <div class="col-lg-5">
        <div class="p-4 bg-dark text-white rounded">
          <h3 class="text-warning fw-bold mb-4">Contact Information</h3>
          <p class="mb-3"><i class="bi bi-geo-alt-fill text-warning me-3 fs-5"></i>Kansanga, Ggaba Road, Kampala</p>
          <p class="mb-3"><i class="bi bi-telephone-fill text-warning me-3 fs-5"></i>+256 700 000000 / +256 770 000000</p>
          <p class="mb-3"><i class="bi bi-envelope-fill text-warning me-3 fs-5"></i>admissions@brightpath.ac.ug</p>
          <p class="mb-0"><i class="bi bi-clock-fill text-warning me-3 fs-5"></i>Mon - Sat: 8:00 AM - 5:00 PM</p>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="col-lg-7">
        <div class="p-4 bg-light rounded shadow-sm">
          <h3 class="fw-bold mb-3">Send Us an Enquiry</h3>
          <p class="small text-muted mb-4">Note: This is a frontend demo form.</p>
          <form onsubmit="event.preventDefault(); alert('Thank you! Your message has been submitted (Demo).');">
            <div class="mb-3">
              <label class="form-label font-weight-bold">Full Name</label>
              <input type="text" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Subject</label>
              <input type="text" class="form-control" placeholder="Course Enquiry" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="4" placeholder="Write your message here..." required></textarea>
            </div>
            <button type="submit" class="btn btn-warning px-4 fw-bold">Submit Message</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5.3.8 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
